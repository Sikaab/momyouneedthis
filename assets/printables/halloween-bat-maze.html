<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Bat Maze - Free Printable | MomYouNeedThis</title>
  <link rel="stylesheet" href="printable.css">
  <style>
    .maze-activity {
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
    }
.maze-endpoints {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 580px;
  margin: 0 auto 10px;
  padding: 0 12px;
  font-size: 42px;
  line-height: 1;
}
.maze-svg {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto;
}
.maze-svg .wall {
  fill: none;
  stroke: #44245f;
  stroke-width: 9;
  stroke-linecap: square;
  stroke-linejoin: miter;
}
@media print {
  .maze-activity {
    max-width: 100%;
  }
  .maze-endpoints {
    font-size: 36px;
  }
}
  </style>
</head>
<body>
  <!-- Keep your existing page header here if it is part of your original HTML. -->
  <main class="resource-page">
    <h1>Halloween Bat Maze</h1>
    <p>Help the bat find its way through the maze to the pumpkin!</p>
<section class="maze-activity" aria-label="Halloween bat maze worksheet">
  <div class="maze-endpoints" aria-hidden="true">
    <span>🦇</span>
    <span>🎃</span>
  </div>
  <svg class="maze-svg"
       viewBox="0 0 600 600"
       role="img"
       aria-label="A Halloween maze with an entrance at the top beside the bat and an exit at the bottom beside the pumpkin">
    <!-- Outer border: open entrance at the top and exit at the bottom -->
    <path class="wall"
          d="M12 12 H205
             M395 12 H588
             V588 H360
             M240 588 H12
             V12" />
    <!-- Internal maze walls -->
    <path class="wall"
          d="M250 12 V95 H170
             M330 95 H420 V180 H95
             M95 12 V260
             M250 180 V260
             M505 95 V260
             M180 260 V345
             M12 345 H335 V270 H505
             M335 345 V430
             M95 430 H180 V515 H340 V430 H425
             M425 430 V515
             M12 515 H95" />
  </svg>
</section>
<!-- Keep your existing footer here if it is part of your original HTML. -->
  </main>
</body>
</html>
