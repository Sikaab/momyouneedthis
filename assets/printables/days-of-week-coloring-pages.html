<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Days of the Week Train! - Free Printable | MomYouNeedThis</title>
<link rel="stylesheet" href="printable.css">
<style>
.train-engine{font-size:76px;text-align:left;margin-bottom:-6px;}
       .train-track{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
       .train-car{background:#fff;border:3px solid #f3d9e2;border-radius:16px;padding:10px 4px 8px;
        text-align:center;box-shadow:0 3px 0 #f3d9e2;}
       .train-car:nth-child(odd){background:#fef6f9;}
       .train-day{font-size:22px;font-weight:900;color:#ad1457;letter-spacing:1px;}
       .train-line{height:8px;background:repeating-linear-gradient(to right,#8a6a78 0 26px,transparent 26px 40px);
        border-radius:4px;margin:2px 30px 0;}
       .train-q{text-align:center;font-size:19px;font-weight:800;color:#4a2c3a;margin-top:8px;}
       .train-blank{display:inline-block;min-width:200px;border-bottom:3px dashed #e8a9c2;height:26px;}
</style>
</head>
<body>
<div class="printable-page">
  <div class="printable-header">
    <div class="printable-kicker">&#x1F5D3;&#xFE0F; Color &amp; Learn</div>
    <div class="printable-title">Days of the Week Train!</div>
    <div class="printable-subtitle">All aboard! Color the 7 cars in order!</div>
  </div>
  <div class="printable-divider"></div>
  <div class="printable-content">
    <div class="activity-instructions">&#x1F58D;&#xFE0F; <strong>Color each train car</strong> a different color, then trace the day names in order — Monday first!</div>
    <div class="train-engine">&#x1F682;</div><div class="train-track"><div class="train-car"><div class="train-day">MON</div><div class="train-trace"><svg viewBox="0 0 120 34" class="dotted-word" style="width:102px;height:auto;display:block;margin:4px auto;"><text x="50%" y="27" text-anchor="middle" font-size="26" font-family="Nunito,sans-serif" font-weight="900" fill="none" stroke="#b08a9a" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" letter-spacing="5">MONDAY</text></svg></div></div>
<div class="train-car"><div class="train-day">TUE</div><div class="train-trace"><svg viewBox="0 0 120 34" class="dotted-word" style="width:102px;height:auto;display:block;margin:4px auto;"><text x="50%" y="27" text-anchor="middle" font-size="26" font-family="Nunito,sans-serif" font-weight="900" fill="none" stroke="#b08a9a" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" letter-spacing="5">TUESDAY</text></svg></div></div>
<div class="train-car"><div class="train-day">WED</div><div class="train-trace"><svg viewBox="0 0 154 34" class="dotted-word" style="width:131px;height:auto;display:block;margin:4px auto;"><text x="50%" y="27" text-anchor="middle" font-size="26" font-family="Nunito,sans-serif" font-weight="900" fill="none" stroke="#b08a9a" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" letter-spacing="5">WEDNESDAY</text></svg></div></div>
<div class="train-car"><div class="train-day">THU</div><div class="train-trace"><svg viewBox="0 0 137 34" class="dotted-word" style="width:117px;height:auto;display:block;margin:4px auto;"><text x="50%" y="27" text-anchor="middle" font-size="26" font-family="Nunito,sans-serif" font-weight="900" fill="none" stroke="#b08a9a" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" letter-spacing="5">THURSDAY</text></svg></div></div>
<div class="train-car"><div class="train-day">FRI</div><div class="train-trace"><svg viewBox="0 0 120 34" class="dotted-word" style="width:102px;height:auto;display:block;margin:4px auto;"><text x="50%" y="27" text-anchor="middle" font-size="26" font-family="Nunito,sans-serif" font-weight="900" fill="none" stroke="#b08a9a" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" letter-spacing="5">FRIDAY</text></svg></div></div>
<div class="train-car"><div class="train-day">SAT</div><div class="train-trace"><svg viewBox="0 0 137 34" class="dotted-word" style="width:117px;height:auto;display:block;margin:4px auto;"><text x="50%" y="27" text-anchor="middle" font-size="26" font-family="Nunito,sans-serif" font-weight="900" fill="none" stroke="#b08a9a" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" letter-spacing="5">SATURDAY</text></svg></div></div>
<div class="train-car"><div class="train-day">SUN</div><div class="train-trace"><svg viewBox="0 0 120 34" class="dotted-word" style="width:102px;height:auto;display:block;margin:4px auto;"><text x="50%" y="27" text-anchor="middle" font-size="26" font-family="Nunito,sans-serif" font-weight="900" fill="none" stroke="#b08a9a" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round" letter-spacing="5">SUNDAY</text></svg></div></div></div>
     <div class="train-line"></div>
