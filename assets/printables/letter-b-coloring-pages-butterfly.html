<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>B is for Butterfly Coloring Page - Free Printable | MomYouNeedThis</title>
<style>
  @page { size: Letter; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 8.5in; height: 11in; background: #ffffff; }
  svg.sheet { display: block; width: 8.5in; height: 11in; }
  .ink { fill: #ffffff; stroke: #000000; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thin { fill: none; stroke: #000000; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .dot { fill: #000000; stroke: none; }
  .ttl { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #000000; }
  .big-letter { font-family: 'Nunito', sans-serif; font-weight: 900; fill: #ffffff; stroke: #000000; stroke-linejoin: round; }

</style>
</head>
<body>
