<!DOCTYPE html>

<title>B is for Bird Coloring Page - Free Printable | MomYouNeedThis</title>
<style>
  @page { size: Letter; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 8.5in; height: 11in; background: #ffffff; }
  svg.sheet { display: block; width: 8.5in; height: 11in; }

</head>
