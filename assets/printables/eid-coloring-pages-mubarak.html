<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eid Mubarak Coloring Page - Free Printable | MomYouNeedThis</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  @page { size: letter; margin: 0; }
  body { font-family:'Nunito','Comic Sans MS',sans-serif; background:#fff; }
  .sheet { width:816px; height:1056px; padding:40px 54px 28px; display:flex; flex-direction:column; align-items:center; overflow:hidden; }
  h1 { font-size:54px; font-weight:900; color:#000; letter-spacing:1px; text-align:center; }
  .sub { font-size:22px; font-weight:700; color:#000; margin-top:6px; text-align:center; }
  .scene { margin-top:10px; }
  .footer { margin-top:auto; font-size:26px; font-weight:800; color:#4a2c3a; letter-spacing:.5px; }
  svg .ln { fill:#fff; stroke:#000; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; }
  svg .lnf { fill:none; stroke:#000; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; }
  svg .md { stroke-width:9; }
  svg .st { stroke-width:6; }
  svg .th { stroke-width:12; }
  svg .txt { font-family:'Nunito','Comic Sans MS',sans-serif; font-weight:900; fill:#fff; stroke:#000; stroke-width:2.4; paint-order:stroke; stroke-linejoin:round; }
  @media print { body { background:none; } .sheet { box-shadow:none; } }
</style>
</head>
<body>
<div class="sheet">
  <h1>Happy Eid!</h1>
  <p class="sub">Color the Eid Mubarak greeting, the moon and the mosque!</p>

  <svg class="scene" width="700" height="660" viewBox="0 0 700 660" role="img" aria-label="Eid Mubarak greeting with a crescent moon, stars, lanterns and a mosque">
    <!-- hanging lantern, left -->
    <g>
      <path class="lnf md" d="M64,0 L64,46"/>
      <path class="ln md" d="M40,74 L88,74 L80,46 L48,46 Z"/>
      <path class="ln md" d="M44,74 L84,74 L88,140 L40,140 Z"/>
      <path class="lnf md" d="M40,126 L88,126"/>
      <path class="ln md" d="M54,126 L54,96 C54,82 74,82 74,96 L74,126 Z"/>
      <path class="lnf md" d="M64,140 L64,150"/>
      <circle class="ln md" cx="64" cy="157" r="6"/>
    </g>
    <!-- hanging lantern, right -->
    <g transform="translate(572,0)">
      <path class="lnf md" d="M64,0 L64,46"/>
      <path class="ln md" d="M40,74 L88,74 L80,46 L48,46 Z"/>
      <path class="ln md" d="M44,74 L84,74 L88,140 L40,140 Z"/>
      <path class="lnf md" d="M40,126 L88,126"/>
      <path class="ln md" d="M54,126 L54,96 C54,82 74,82 74,96 L74,126 Z"/>
      <path class="lnf md" d="M64,140 L64,150"/>
      <circle class="ln md" cx="64" cy="157" r="6"/>
    </g>

    <!-- crescent moon -->
    <g transform="translate(380,96) scale(0.58)">
      <path class="ln th" d="M0,-60 A60,60 0 1,0 0,60 A109,109 0 0,1 0,-60 Z"/>
    </g>

    <!-- stars -->
    <g transform="translate(168,84)"><polygon class="ln st" points="0.0,-30.0 7.9,-10.9 28.5,-9.3 12.8,4.2 17.6,24.3 0.0,13.5 -17.6,24.3 -12.8,4.2 -28.5,-9.3 -7.9,-10.9"/></g>
    <g transform="translate(528,80)"><polygon class="ln st" points="0.0,-22.0 5.8,-8.0 20.9,-6.8 9.4,3.1 12.9,17.8 0.0,9.9 -12.9,17.8 -9.4,3.1 -20.9,-6.8 -5.8,-8.0"/></g>
    <g transform="translate(614,196)"><polygon class="ln st" points="0.0,-16.0 4.2,-5.8 15.2,-4.9 6.8,2.2 9.4,12.9 0.0,7.2 -9.4,12.9 -6.8,2.2 -15.2,-4.9 -4.2,-5.8"/></g>
    <g transform="translate(90,300)"><polygon class="ln st" points="0.0,-16.0 4.2,-5.8 15.2,-4.9 6.8,2.2 9.4,12.9 0.0,7.2 -9.4,12.9 -6.8,2.2 -15.2,-4.9 -4.2,-5.8"/></g>

    <!-- big greeting letters -->
    <text class="txt" x="350" y="246" font-size="128" text-anchor="middle">Eid</text>
    <text class="txt" x="350" y="368" font-size="92" text-anchor="middle">Mubarak</text>

    <!-- mosque skyline -->
    <path class="lnf th" d="M30,648 L670,648"/>
    <!-- left minaret -->
    <path class="ln" d="M176,648 L176,486 L210,486 L210,648 Z"/>
    <path class="ln" d="M168,486 L168,470 L218,470 L218,486 Z"/>
    <path class="ln" d="M174,470 C174,446 184,438 193,420 C202,438 212,446 212,470 Z"/>
    <circle class="ln md" cx="193" cy="412" r="4"/>
    <!-- right minaret -->
    <path class="ln" d="M490,648 L490,486 L524,486 L524,648 Z"/>
    <path class="ln" d="M482,486 L482,470 L532,470 L532,486 Z"/>
    <path class="ln" d="M488,470 C488,446 498,438 507,420 C516,438 526,446 526,470 Z"/>
    <circle class="ln md" cx="507" cy="412" r="4"/>
    <!-- side wings -->
    <path class="ln" d="M210,648 L210,560 L262,560 L262,648 Z"/>
    <path class="ln" d="M226,614 L226,586 C226,574 246,574 246,586 L246,614 Z"/>
    <path class="ln" d="M438,648 L438,560 L490,560 L490,648 Z"/>
    <path class="ln" d="M454,614 L454,586 C454,574 474,574 474,586 L474,614 Z"/>
    <!-- centre block -->
    <path class="ln" d="M262,648 L262,516 L438,516 L438,648 Z"/>
    <!-- dome -->
    <path class="ln" d="M288,516 C288,478 320,468 334,446 C344,430 348,418 350,408 C352,418 356,430 366,446 C380,468 412,478 412,516 Z"/>
    <path class="lnf md" d="M350,408 L350,396"/>
    <g transform="translate(366,388) scale(0.13)"><path class="ln" d="M0,-60 A60,60 0 1,0 0,60 A109,109 0 0,1 0,-60 Z"/></g>
    <!-- door and windows -->
    <path class="ln" d="M322,648 L322,578 C322,550 378,550 378,578 L378,648 Z"/>
    <path class="ln" d="M292,612 L292,568 C292,552 316,552 316,568 L316,612 Z"/>
    <path class="ln" d="M384,612 L384,568 C384,552 408,552 408,568 L408,612 Z"/>
  </svg>

  <div class="footer">momyouneedthis</div>
</div>
</body>
</html>
