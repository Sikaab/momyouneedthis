<!DOCTYPE html>
<html lang="en">
<head>

<title>I Smell - Five Senses Coloring Page - Free Printable | MomYouNeedThis</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  @page { size: letter; margin: 0; }
  body { font-family:'Nunito','Comic Sans MS',sans-serif; background:#fff; }
  .sheet { width:816px; height:1056px; padding:40px 54px 28px; display:flex; flex-direction:column; align-items:center; overflow:hidden; }

  .cell { text-align:center; }
  .label { font-size:23px; font-weight:900; letter-spacing:2px; margin-top:2px; color:#000; }
  .footer { margin-top:auto; font-size:27px; font-weight:600; color:#000; letter-spacing:.5px; }
  svg .ln { fill:#fff; stroke:#000; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; }
  svg .lnf { fill:none; stroke:#000; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; }
  svg .th { stroke-width:12; }
  svg .fill { fill:#000; }
  @media print { body { background:none; } .sheet { box-shadow:none; } }
</style>
</head>
<body>
<div class="sheet">
