<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">


<rect width="400" height="500" rx="35" fill="#FFF0E8"/>


<!-- toddler head -->

<circle cx="200" cy="120" r="70" fill="#F6C6A8"/>


<!-- hair -->

<path d="M130 120 Q200 20 270 120"
fill="#6B4030"/>


<!-- face -->

<circle cx="175" cy="125" r="8" fill="#333"/>
<circle cx="225" cy="125" r="8" fill="#333"/>


<path d="M175 160 Q200 180 225 160"
stroke="#333"
stroke-width="6"
fill="none"/>



<!-- shirt -->

<rect x="140" y="190" width="120" height="100" rx="30" fill="#F49BAD"/>


<!-- potty -->

<ellipse cx="200" cy="350" rx="90" ry="55" fill="#FFD36A"/>

<path d="M110 350 Q200 450 290 350"
fill="#FFC44D"/>


<!-- stars -->

<text x="70" y="90" font-size="35">⭐</text>
<text x="300" y="180" font-size="35">✨</text>


</svg>